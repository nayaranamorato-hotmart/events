<html lang="pt-BR">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0d0d0f;
      --bg-card: #1c1c1e;
      --bg-card-secondary: #2a2a2c;
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.55);
      --text-muted: rgba(255,255,255,0.35);
      --accent-orange: #d95e00;
      --border-subtle: rgba(255,255,255,0.08);
      --border-card: rgba(255,255,255,0.13);
      --radius: 12px;
      --px: 16px;
    }
    html, body, #root { height: 100%; }
    body { background: #000; color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    #root { display: flex; justify-content: center; min-height: 100%; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
    .app { width: 100%; max-width: 430px; min-height: 100%; background: var(--bg); position: relative; overflow-x: hidden; }

    /* HERO */
    .hero { position: relative; width: 100%; height: 220px; overflow: hidden; background: radial-gradient(ellipse at 55% 25%, rgba(180,90,10,0.55) 0%, transparent 55%), radial-gradient(ellipse at 40% 70%, rgba(80,30,0,0.4) 0%, transparent 50%), linear-gradient(180deg,#1a0d00 0%,#0d0d0f 100%); }
    .hero__btn { position: absolute; top: 14px; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; z-index: 10; transition: opacity .15s; }
    .hero__btn:active { opacity: .75; }
    .hero__back { left: 16px; background: rgba(0,0,0,.4); color: white; }
    .hero__menu { right: 16px; background: var(--accent-orange); color: white; width: 40px; height: 40px; }
    .hero__gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: linear-gradient(to bottom,transparent,var(--bg)); pointer-events: none; }

    /* EVENT INFO */
    .event-info { padding: 14px var(--px) 10px; }
    .event-info__title { font-size: 22px; font-weight: 700; text-align: center; letter-spacing: -.3px; margin-bottom: 16px; }
    .event-info__details { border: 1px solid var(--border-card); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .event-info__row { display: flex; align-items: flex-start; gap: 10px; }
    .event-info__icon { flex-shrink: 0; color: var(--text-secondary); display: flex; margin-top: 1px; }
    .event-info__text { font-size: 14px; line-height: 1.4; }

    /* BUTTONS */
    .action-buttons { padding: 14px var(--px) 8px; display: flex; flex-direction: column; gap: 10px; }
    .btn-tickets { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: white; color: #111; border-radius: 100px; padding: 14px 20px; font-size: 15px; font-weight: 600; transition: opacity .15s; }
    .btn-tickets:active { opacity: .85; }
    .btn-row { display: flex; gap: 10px; }
    .btn-secondary { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; background: transparent; color: white; border: 1px solid rgba(255,255,255,.22); border-radius: 100px; padding: 12px 14px; font-size: 14px; font-weight: 600; transition: opacity .15s; }
    .btn-secondary:active { opacity: .75; }

    /* TAB BAR */
    .tab-bar { display: flex; border-bottom: 1px solid var(--border-subtle); padding: 0 var(--px); margin-top: 6px; }
    .tab-bar__tab { padding: 14px 16px 12px; font-size: 15px; font-weight: 500; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .2s; white-space: nowrap; letter-spacing: -.1px; }
    .tab-bar__tab--active { color: white; border-bottom-color: white; font-weight: 600; }

    /* TAB CONTENT */
    .tab-content { padding: 20px var(--px) 48px; }

    /* SECTION */
    .section { margin-bottom: 28px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
    .section-link { display: flex; align-items: center; gap: 5px; font-size: 14px; color: var(--text-secondary); background: none; border: none; padding: 0; transition: opacity .15s; }
    .section-link:active { opacity: .7; }

    /* SOBRE */
    .sobre__text { font-size: 14px; line-height: 1.65; color: var(--text-secondary); }
    .sobre__text p { margin-bottom: 12px; }
    .sobre__text p:last-child { margin-bottom: 0; }
    .sobre__text strong { color: var(--text-primary); font-weight: 600; }
    .sobre__collapsed { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; font-size: 14px; line-height: 1.65; color: var(--text-secondary); }
    .sobre__toggle-row { margin-top: 4px; }
    .sobre__toggle { font-size: 14px; font-weight: 700; color: white; background: none; border: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; transition: opacity .15s; }
    .sobre__toggle:active { opacity: .7; }
    .sobre__toggle--less { display: block; margin-top: 8px; }

    /* MATERIALS CAROUSEL */
    .materials-carousel { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; }
    .materials-carousel::-webkit-scrollbar { display: none; }
    .mat-card { min-width: 196px; background: var(--bg-card); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .mat-card__thumb { width: 56px; height: 40px; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .mat-card__thumb-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .mat-card__info { flex: 1; min-width: 0; }
    .mat-card__title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
    .mat-card__subtitle { font-size: 11px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mat-card__action { flex-shrink: 0; color: var(--text-secondary); display: flex; }

    /* SCHEDULE */
    .schedule-list { display: flex; flex-direction: column; }
    .schedule-day-group { display: flex; gap: 12px; }
    .schedule-day-group + .schedule-day-group { margin-top: 4px; }
    .day-label { display: flex; flex-direction: column; align-items: center; width: 40px; flex-shrink: 0; padding-top: 14px; }
    .day-label__name { font-size: 11px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; line-height: 1; }
    .day-label__number { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--text-primary); margin-top: 2px; }
    .day-sessions { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-bottom: 8px; }

    /* SESSION CARD */
    .session-card { background: var(--bg-card); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: opacity .15s; }
    .session-card:active { opacity: .85; }
    .session-card__speakers { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .speaker-avatars { display: flex; align-items: center; flex-shrink: 0; }
    .speaker-avatar { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--bg-card); display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 800; color: white; flex-shrink: 0; }
    .speaker-avatar + .speaker-avatar { margin-left: -7px; }
    .session-card__speaker-names { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .session-card__body { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .session-card__title { font-size: 14px; font-weight: 700; line-height: 1.45; flex: 1; min-width: 0; }
    .session-card__chevron { flex-shrink: 0; color: var(--text-secondary); display: flex; align-items: center; margin-top: 2px; }
    .session-card__chevron svg { transition: transform .25s ease; }
    .session-card__chevron--up svg { transform: rotate(180deg); }
    .session-card__meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    .session-meta-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-secondary); }
    .session-card__expanded { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
    .session-card__description { font-size: 13px; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .session-card__more-btn { margin-top: 12px; background: var(--bg-card-secondary); color: white; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; display: inline-block; transition: opacity .15s; }
    .session-card__more-btn:active { opacity: .75; }

    /* SHOW ALL */
    .btn-show-all { width: 100%; background: var(--bg-card); color: white; border-radius: 100px; padding: 14px; font-size: 15px; font-weight: 600; margin-top: 4px; text-align: center; transition: opacity .15s; }
    .btn-show-all:active { opacity: .75; }

    /* MATERIALS LIST */
    .material-list { display: flex; flex-direction: column; gap: 8px; }
    .material-item { background: var(--bg-card); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 12px; }
    .material-item__media { flex-shrink: 0; }
    .material-item__thumb { width: 64px; height: 48px; border-radius: 8px; overflow: hidden; }
    .material-item__thumb-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .material-item__icon { width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .material-item__icon--pdf { background: #c0392b; }
    .material-item__icon--link { background: var(--bg-card-secondary); }
    .material-item__icon--file { background: var(--bg-card-secondary); }
    .material-item__info { flex: 1; min-width: 0; }
    .material-item__title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
    .material-item__subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .material-item__action { flex-shrink: 0; color: var(--text-secondary); display: flex; padding: 4px; transition: opacity .15s; }
    .material-item__action:active { opacity: .6; }
    .pdf-text { font-size: 9px; font-weight: 800; color: white; letter-spacing: .5px; }
  </style>
</head>

      <div style={{ width:'100%', height:'100%', background:'linear-gradient(135deg,#c0622a,#5a2000)', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,200,150,0.5)" strokeWidth="1.5">
          <circle cx="12" cy="12" r="9"/><path d="M12 3L12 21"/><path d="M3 12L21 12"/>
        </svg>
      </div>
    );
    const PdfBox = () => (
      <div className="material-item__icon material-item__icon--pdf"><span className="pdf-text">PDF</span></div>
    );
    const LinkBox = () => (
      <div className="material-item__icon material-item__icon--link"><LinkIcon/></div>
    );
    const FileBox = () => (
      <div className="material-item__icon material-item__icon--file"><FileIcon/></div>
    );

    // ─── MATERIAL ITEM ───────────────────────────────────────────────────────
    function MaterialItem({ material, compact }) {
      const isDownload = ['pdf-image','pdf-icon','file'].includes(material.type);

      const Media = () => {
        if (material.type === 'youtube') return compact
          ? <div className="mat-card__thumb"><div className="mat-card__thumb-inner"><YoutubeThumbnail/></div></div>
          : <div className="material-item__thumb"><div className="material-item__thumb-inner"><YoutubeThumbnail/></div></div>;
        if (material.type === 'pdf-image') return compact
          ? <div className="mat-card__thumb"><div className="mat-card__thumb-inner"><PizzaThumbnail/></div></div>
          : <div className="material-item__thumb"><div className="material-item__thumb-inner"><PizzaThumbnail/></div></div>;
        if (material.type === 'pdf-icon') return <PdfBox/>;
        if (material.type === 'link')     return <LinkBox/>;
        return <FileBox/>;
      };

      if (compact) {
        return (
          <div className="mat-card">
            <Media/>
            <div className="mat-card__info">
              <div className="mat-card__title">{material.title}</div>
              {material.subtitle && <div className="mat-card__subtitle">{material.subtitle}</div>}
            </div>
            <span className="mat-card__action">{isDownload ? <DownloadIcon/> : <ExternalLink/>}</span>
          </div>
        );
      }

      return (
        <div className="material-item">
          <div className="material-item__media"><Media/></div>
          <div className="material-item__info">
            <div className="material-item__title">{material.title}</div>
            {material.subtitle && <div className="material-item__subtitle">{material.subtitle}</div>}
          </div>
          <button className="material-item__action">{isDownload ? <DownloadIcon/> : <ExternalLink/>}</button>
        </div>
      );
    }

    // ─── SCHEDULE ITEM ───────────────────────────────────────────────────────
    function ScheduleItem({ session, expanded, onToggle }) {
      return (
        <div className="session-card" onClick={onToggle}>
          {session.speakers && session.speakers.length > 0 && (
            <div className="session-card__speakers">
              <div className="speaker-avatars">
                {session.speakers.map(sp => (
                  <div key={sp.id} className="speaker-avatar" style={{ background: sp.color }}>{sp.initials}</div>
                ))}
              </div>
              <span className="session-card__speaker-names">
                {session.speakers.map(s => s.name).join(', ')}
              </span>
            </div>
          )}
          <div className="session-card__body">
            <span className="session-card__title">{session.title}</span>
            <span className={`session-card__chevron${expanded ? ' session-card__chevron--up' : ''}`}>
              <ChevronDown up={expanded}/>
            </span>
          </div>
          <div className="session-card__meta">
            <span className="session-meta-item"><ClockIcon/>{session.startTime} - {session.endTime}</span>
            {session.venue && <span className="session-meta-item"><MapPin/>{session.venue}</span>}
          </div>
          {expanded && session.description && (
            <div className="session-card__expanded" onClick={e => e.stopPropagation()}>
              <p className="session-card__description">{session.description}</p>
              <button className="session-card__more-btn">Mais detalhes</button>
            </div>
          )}
        </div>
      );
    }

    // ─── HOME TAB ────────────────────────────────────────────────────────────
    function HomeTab({ sobreExpanded, onToggleSobre, expandedSessions, onToggleSession, onGoToMateriais, onGoToProgramacao }) {
      return (
        <>
          {/* Sobre */}
          <div className="section">
            <h2 className="section-title" style={{ marginBottom:12 }}>Sobre</h2>
            {sobreExpanded ? (
              <>
                <div className="sobre__text" dangerouslySetInnerHTML={{ __html: eventData.aboutHtml }}/>
                <button className="sobre__toggle sobre__toggle--less" onClick={onToggleSobre}>Mostrar menos</button>
              </>
            ) : (
              <>
                <p className="sobre__collapsed">{eventData.about}</p>
                <div className="sobre__toggle-row">
                  <button className="sobre__toggle" onClick={onToggleSobre}>Mostrar mais</button>
                </div>
              </>
            )}
          </div>

          {/* Materiais */}
          <div className="section">
            <div className="section-header">
              <h2 className="section-title">Materiais</h2>
              <button className="section-link" onClick={onGoToMateriais}>
                Tudo ({eventData.materials.length})<ArrowRight/>
              </button>
            </div>
            <div className="materials-carousel">
              {eventData.materials.slice(0,4).map(m => <MaterialItem key={m.id} material={m} compact={true}/>)}
            </div>
          </div>

          {/* Programação preview */}
          <div className="section">
            <h2 className="section-title" style={{ marginBottom:14 }}>Programação</h2>
            <div className="schedule-list">
              {eventData.schedule.map(dg => (
                <div key={dg.day} className="schedule-day-group">
                  <div className="day-label">
                    <span className="day-label__name">{dg.dayName}</span>
                    <span className="day-label__number">{dg.day}</span>
                  </div>
                  <div className="day-sessions">
                    {dg.sessions.map(s => (
                      <ScheduleItem key={s.id} session={s} expanded={expandedSessions.has(s.id)} onToggle={() => onToggleSession(s.id)}/>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <button className="btn-show-all" onClick={onGoToProgramacao}>Mostrar tudo</button>
          </div>
        </>
      );
    }

    // ─── APP ─────────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState('inicio');
      const [sobreExpanded, setSobreExpanded] = useState(false);
      const [expandedSessions, setExpandedSessions] = useState(new Set());

      const toggleSession = id => {
        setExpandedSessions(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      const goToTab = t => { setTab(t); window.scrollTo({ top:0, behavior:'smooth' }); };

      return (
        <div className="app">
          {/* Hero */}
          <div className="hero">
            <button className="hero__btn hero__back" onClick={() => window.history.back()}><BackIcon/></button>
            <button className="hero__btn hero__menu"><DotsIcon/></button>
            <div className="hero__gradient"/>
          </div>

          {/* Event Info */}
          <div className="event-info">
            <h1 className="event-info__title">{eventData.name}</h1>
            <div className="event-info__details">
              <div className="event-info__row">
                <span className="event-info__icon"><CalendarIcon/></span>
                <span className="event-info__text">{eventData.date}</span>
              </div>
              <div className="event-info__row">
                <span className="event-info__icon"><LocationIcon/></span>
                <span className="event-info__text">{eventData.location}</span>
              </div>
            </div>
          </div>

          {/* Action Buttons */}
          <div className="action-buttons">
            <button className="btn-tickets"><TicketIcon/>Mostrar ingressos ({eventData.ticketCount})</button>
            <div className="btn-row">
              <button className="btn-secondary"><CalendarIcon/>Calendário</button>
              <button className="btn-secondary"><LocationIcon/>Localização</button>
            </div>
          </div>

          {/* Tab Bar */}
          <div className="tab-bar">
            {[['inicio','Início'],['materiais','Materiais'],['programacao','Programação']].map(([id,label]) => (
              <button key={id} className={`tab-bar__tab${tab===id?' tab-bar__tab--active':''}`} onClick={() => goToTab(id)}>{label}</button>
            ))}
          </div>

          {/* Tab Content */}
          <div className="tab-content">
            {tab === 'inicio' && (
              <HomeTab
                sobreExpanded={sobreExpanded}
                onToggleSobre={() => setSobreExpanded(v => !v)}
                expandedSessions={expandedSessions}
                onToggleSession={toggleSession}
                onGoToMateriais={() => goToTab('materiais')}
                onGoToProgramacao={() => goToTab('programacao')}
              />
            )}
            {tab === 'materiais' && (
              <div className="material-list">
                {eventData.materials.map(m => <MaterialItem key={m.id} material={m} compact={false}/>)}
              </div>
            )}
            {tab === 'programacao' && (
              <div className="schedule-list">
                {eventData.schedule.map(dg => (
                  <div key={dg.day} className="schedule-day-group">
                    <div className="day-label">
                      <span className="day-label__name">{dg.dayName}</span>
                      <span className="day-label__number">{dg.day}</span>
                    </div>
                    <div className="day-sessions">
                      {dg.sessions.map(s => (
                        <ScheduleItem key={s.id} session={s} expanded={expandedSessions.has(s.id)} onToggle={() => toggleSession(s.id)}/>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
